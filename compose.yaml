services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: devdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - devdocs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: devdocs-document-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  ingest-static:
    build:
      context: ./ingest-static
      dockerfile: Dockerfile
    container_name: devdocs-ingest-static
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
    ports:
      - "8082:8082"

volumes:
  devdocs_pgdata:
