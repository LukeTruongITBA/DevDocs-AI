services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: devdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - devdocs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: devdocs-document-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy


  ingest-static:
    build:
      context: ./ingest-static
      dockerfile: Dockerfile
    container_name: devdocs-ingest-static
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8082
      EMBEDDING_PROVIDER: ollama
      OLLAMA_EMBEDDING_URL: ${OLLAMA_EMBEDDING_URL:-http://host.docker.internal:11434/api/embed}
      EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:137m-v1.5-fp16}
      EMBEDDING_DIMENSIONS: 768
      EMBEDDING_BATCH_SIZE: ${OLLAMA_EMBEDDING_BATCH_SIZE:-16}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      INGESTION_MAX_PAGES: ${INGESTION_MAX_PAGES:-100}
      INGESTION_REQUEST_TIMEOUT_SECONDS: ${INGESTION_REQUEST_TIMEOUT_SECONDS:-20}
      INGESTION_MAX_BATCH_SOURCES: ${INGESTION_MAX_BATCH_SOURCES:-4}
      INGESTION_MAX_EXTRACTED_CHARACTERS: ${INGESTION_MAX_EXTRACTED_CHARACTERS:-100000}
      INGESTION_MAX_CHUNKS_PER_SOURCE: ${INGESTION_MAX_CHUNKS_PER_SOURCE:-200}
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy

  ingest-dynamic:
    build:
      context: ./ingest-dynamic
      dockerfile: Dockerfile
    container_name: devdocs-ingest-dynamic
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8083
      DOCUMENT_SERVICE_URL: http://document-service:8081
      EMBEDDING_PROVIDER: ollama
      OLLAMA_EMBEDDING_URL: ${OLLAMA_EMBEDDING_URL:-http://host.docker.internal:11434/api/embed}
      EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:137m-v1.5-fp16}
      EMBEDDING_DIMENSIONS: 768
      EMBEDDING_BATCH_SIZE: ${OLLAMA_EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_MAX_ATTEMPTS: ${EMBEDDING_MAX_ATTEMPTS:-1}
      EMBEDDING_INITIAL_BACKOFF_MILLIS: ${EMBEDDING_INITIAL_BACKOFF_MILLIS:-250}
      EMBEDDING_MAX_BACKOFF_MILLIS: ${EMBEDDING_MAX_BACKOFF_MILLIS:-2000}
      EMBEDDING_JITTER_RATIO: ${EMBEDDING_JITTER_RATIO:-0.2}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      INGESTION_MAX_PAGES: ${INGESTION_MAX_PAGES:-100}
      INGESTION_REQUEST_TIMEOUT_SECONDS: ${INGESTION_REQUEST_TIMEOUT_SECONDS:-20}
      INGESTION_MAX_BATCH_SOURCES: ${INGESTION_MAX_BATCH_SOURCES:-4}
      INGESTION_MAX_EXTRACTED_CHARACTERS: ${INGESTION_MAX_EXTRACTED_CHARACTERS:-100000}
      INGESTION_MAX_CHUNKS_PER_SOURCE: ${INGESTION_MAX_CHUNKS_PER_SOURCE:-200}
    ports:
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
      document-service:
        condition: service_started

  pre-retrieval-service:
    build:
      context: ./pre-retrieval-service
      dockerfile: Dockerfile
    container_name: devdocs-pre-retrieval-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8084
      EMBEDDING_PROVIDER: ollama
      OLLAMA_EMBEDDING_URL: ${OLLAMA_EMBEDDING_URL:-http://host.docker.internal:11434/api/embed}
      EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:137m-v1.5-fp16}
      EMBEDDING_DIMENSIONS: 768
      EMBEDDING_BATCH_SIZE: ${OLLAMA_EMBEDDING_BATCH_SIZE:-16}
      POST_RETRIEVAL_SERVICE_URL: http://post-retrieval-service:8085
    ports:
      - "8084:8084"
    depends_on:
      db:
        condition: service_healthy
      post-retrieval-service:
        condition: service_started

  post-retrieval-service:
    build:
      context: ./post-retrieval-service
      dockerfile: Dockerfile
    container_name: devdocs-post-retrieval-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_LLM_MODEL: ${CLOUDFLARE_LLM_MODEL:-@cf/zai-org/glm-4.7-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-3.8-flash}
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: devdocs-eureka-server
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: eureka-server
    ports:
      - "8761:8761"
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: devdocs-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      DOCUMENT_SERVICE_URL: http://document-service:8081
      PRE_RETRIEVAL_SERVICE_URL: http://pre-retrieval-service:8084
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - document-service
      - pre-retrieval-service
volumes:
  devdocs_pgdata:
