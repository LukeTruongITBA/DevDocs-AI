services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: devdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - devdocs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: devdocs-document-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy


  ingest-static:
    build:
      context: ./ingest-static
      dockerfile: Dockerfile
    container_name: devdocs-ingest-static
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
  ingest-dynamic:
    build:
      context: ./ingest-dynamic
      dockerfile: Dockerfile
    container_name: devdocs-ingest-dynamic
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
  pre-retrieval-service:
    build:
      context: ./pre-retrieval-service
      dockerfile: Dockerfile
    container_name: devdocs-pre-retrieval-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      db:
        condition: service_healthy

  post-retrieval-service:
    build:
      context: ./post-retrieval-service
      dockerfile: Dockerfile
    container_name: devdocs-post-retrieval-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: devdocs-eureka-server
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: eureka-server
    ports:
      - "8761:8761"
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: devdocs-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      DOCUMENT_SERVICE_URL: http://document-service:8081
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - document-service
volumes:
  devdocs_pgdata:
