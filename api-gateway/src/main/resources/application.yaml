spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: document-service
              uri: ${DOCUMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/documents/**

            - id: pre-retrieval-service
              uri: ${PRE_RETRIEVAL_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/query/**

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info