
spring:
  application:
    name: devdocs-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/devdocs}
    username: ${DB_USERNAME:devdocs}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
