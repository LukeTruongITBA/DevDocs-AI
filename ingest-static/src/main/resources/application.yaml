
spring:
  application:
    name: ingest-static

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/devdocs}
    username: ${DB_USERNAME:devdocs}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
app:
  ingestion:
    chunk-size: 1000
    chunk-overlap: 200
  embedding:
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:batchEmbedContents}
    api-key: ${GEMINI_API_KEY:}
    model: ${EMBEDDING_MODEL:models/gemini-embedding-001}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
    batch-size: ${EMBEDDING_BATCH_SIZE:64}