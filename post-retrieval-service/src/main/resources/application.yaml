spring:
  application:
    name: post-retrieval-service

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  llm:
    cloudflare:
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_API_TOKEN:}
      model: ${CLOUDFLARE_LLM_MODEL:@cf/zai-org/glm-4.7-flash}
    gemini:
      api-url: ${GEMINI_INTERACTIONS_API_URL:https://generativelanguage.googleapis.com/v1beta/interactions}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_LLM_MODEL:gemini-3.8-flash}