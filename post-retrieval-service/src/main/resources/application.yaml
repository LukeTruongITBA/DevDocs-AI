
spring:
  application:
    name: post-retrieval-service

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  llm:
    gemini:
      api-url: ${GEMINI_INTERACTIONS_API_URL:https://generativelanguage.googleapis.com/v1beta/interactions}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_LLM_MODEL:gemini-3.8-flash}
