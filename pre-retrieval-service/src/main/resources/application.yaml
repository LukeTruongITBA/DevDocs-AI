
spring:
  application:
    name: pre-retrieval-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/devdocs}
    username: ${DB_USERNAME:devdocs}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8084}

app:
  embedding:
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:batchEmbedContents}
    api-key: ${GEMINI_API_KEY:}
    model: ${EMBEDDING_MODEL:models/gemini-embedding-001}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
    batch-size: ${EMBEDDING_BATCH_SIZE:64}

  post-retrieval:
    base-url: ${POST_RETRIEVAL_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
