
spring:
  application:
    name: pre-retrieval-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/devdocs}
    username: ${DB_USERNAME:devdocs}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8084}

app:
  embedding:
    provider: ${EMBEDDING_PROVIDER:ollama}
    api-url: ${EMBEDDING_API_URL:${OLLAMA_EMBEDDING_URL:http://localhost:11434/api/embed}}
    api-key: ${GEMINI_API_KEY:}
    model: ${EMBEDDING_MODEL:nomic-embed-text:137m-v1.5-fp16}
    dimensions: ${EMBEDDING_DIMENSIONS:768}
    batch-size: ${EMBEDDING_BATCH_SIZE:64}
    read-timeout-millis: ${EMBEDDING_READ_TIMEOUT_MILLIS:120000}
    connect-timeout-millis: ${EMBEDDING_CONNECT_TIMEOUT_MILLIS:5000}

  post-retrieval:
    base-url: ${POST_RETRIEVAL_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Story 4 Task 1: cross-encoder reranker (TEI /rerank). The pipeline retrieves
# candidate-count chunks, reranks, and returns topK. On any reranker failure
# the vector order is kept.
---
app:
  reranking:
    enabled: ${RERANKER_ENABLED:true}
    url: ${RERANKER_URL:http://localhost:8086}
    model: ${RERANKER_MODEL:cross-encoder/mmarco-mMiniLMv2-L12-H384-v1@1427fd652930e4ba29e8149678df786c240d8825}
    candidate-count: ${RERANKER_CANDIDATE_COUNT:20}
    connect-timeout-millis: ${RERANKER_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${RERANKER_READ_TIMEOUT_MILLIS:10000}
